<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administración | Restaurante Tarca Luis</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      background: linear-gradient(135deg, #1f1b18 0%, #2f2520 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .login-emblem {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 4px 16px rgba(200, 90, 50, 0.4);
    }
    .demo-credentials-box {
      background: #faf7f2;
      border: 1px dashed #dcd3c8;
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: #6e645e;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-emblem">🔒</div>
    <h1 style="font-family: var(--font-serif); font-size: 1.8rem; color: var(--color-volcanic); margin-bottom: 0.35rem;">Tarca Luis</h1>
    <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 2rem;">Panel de Administración y Control</p>

    <div id="loginAlert" style="display: none; background: #f8d7da; color: #721c24; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;"></div>

    <form id="loginForm" style="text-align: left;">
      <div class="form-group">
        <label class="form-label" for="username">Usuario Administrador</label>
        <input type="text" id="username" class="form-control" placeholder="Introduce tu usuario" required autocomplete="username" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Introduce tu contraseña" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
        Iniciar Sesión
      </button>
    </form>

    <div class="demo-credentials-box">
      <strong>🔑 Datos de acceso iniciales:</strong><br>
      • Usuario: <code style="color:var(--color-primary); font-weight:bold;">admin</code><br>
      • Contraseña: <code style="color:var(--color-primary); font-weight:bold;">admin1234</code><br>
      <span style="font-size:0.78rem; color:#888;">* Puedes cambiar la contraseña en la pestaña de Seguridad.</span>
    </div>

    <p style="margin-top: 2rem; font-size: 0.85rem;">
      <a href="/" style="color: var(--color-stone);">← Volver a la web del restaurante</a>
    </p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const alertBox = document.getElementById('loginAlert');
      const btn = document.getElementById('btnLogin');

      // Si ya tiene sesión activa, redirigir directo
      fetch('/api/auth/me')
        .then(res => res.json())
        .then(data => {
          if (data.user) {
            window.location.href = '/admin';
          }
        })
        .catch(() => {});

      form.addEventListener('submit', async e => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Verificando...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            // Guardar token si es necesario (la cookie HttpOnly se encarga)
            localStorage.setItem('tl_token', data.token);
            window.location.href = '/admin';
          } else {
            alertBox.textContent = data.error || 'Credenciales incorrectas.';
            alertBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Iniciar Sesión';
          }
        } catch (err) {
          alertBox.textContent = 'Error de conexión con el servidor.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
        }
      });
    });
  </script>
</body>
</html>
